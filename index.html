<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CompEdu – Computer Engineering classroom</title>
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b6cff'/%3E%3Cpath d='M12 11 7 16l5 5M20 11l5 5-5 5' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a1128;--bg2:#0d1633;--card:#121d42;--card2:#1a2858;--inp:#0b1330;
  --line:rgba(140,160,255,.17);--text:#e9edfc;--mute:#9aa6cc;
  --acc:#5b8cff;--acc2:#8b5cf6;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;
  --grad:linear-gradient(135deg,#4f7dff,#8b5cf6);--sh:0 14px 40px rgba(2,6,30,.45);--r:14px;
  --fd:'Sora',system-ui,'Segoe UI',sans-serif;
  --fb:'Source Sans 3',system-ui,'Segoe UI',Roboto,Arial,sans-serif;
}
[data-theme=light]{
  --bg:#f2f4fb;--bg2:#e8ecf8;--card:#ffffff;--card2:#eef1ff;--inp:#ffffff;
  --line:rgba(30,41,110,.14);--text:#141a3a;--mute:#566087;
  --acc:#3a64f0;--acc2:#7c3aed;--ok:#0f9f6e;--warn:#b7791f;--bad:#d64545;--sh:0 12px 32px rgba(30,41,110,.14);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.5 var(--fb);background:var(--bg);color:var(--text);min-height:100vh}
body.lock{overflow:hidden}
h1,h2,h3,h4{font-family:var(--fd);margin:0;letter-spacing:-.01em;font-weight:600}
h1{font-size:1.6rem;line-height:1.2}h2{font-size:1.12rem}h3{font-size:1rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ic{flex:none;vertical-align:middle}
.mute{color:var(--mute)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;text-decoration:none;color:var(--text);transition:border-color .15s,filter .15s,transform .05s;white-space:nowrap}
.btn:hover{border-color:var(--acc)}.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--grad);border-color:transparent;color:#fff}.btn.pri:hover{filter:brightness(1.1)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.btn.sm{min-height:32px;padding:0 11px;font-size:.88rem;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.wa{color:#25d366;border-color:color-mix(in srgb,#25d366 45%,transparent)}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--mute);position:relative}
.icon-btn:hover{background:var(--card);color:var(--text);border-color:var(--line)}
.dot{position:absolute;top:4px;right:3px;min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font:700 .68rem/17px var(--fd);text-align:center;padding:0 4px}
input:not([type=checkbox]):not([type=radio]):not([type=file]),select,textarea{width:100%;min-height:42px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--inp);color:var(--text)}
textarea{resize:vertical;min-height:90px}
input[type=file]{width:100%;padding:8px;border:1px dashed var(--line);border-radius:10px;background:var(--inp)}
input[type=checkbox],input[type=radio]{accent-color:var(--acc);width:17px;height:17px}
.f{display:grid;gap:6px;font-weight:600;font-size:.9rem;align-content:start}
.f small{font-weight:400;color:var(--mute);font-size:.82rem}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.stack{display:grid;gap:14px}
.chk{display:flex;align-items:center;gap:10px;font-weight:600;font-size:.92rem;cursor:pointer}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}

/* layout */
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;gap:18px}
.brand{display:flex;align-items:center;gap:10px;font:700 1.2rem var(--fd);padding:4px 8px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--grad);display:grid;place-items:center;color:#fff}
.nav{display:grid;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:var(--mute);text-decoration:none;font-weight:600}
.nav a:hover{background:var(--card);color:var(--text)}
.nav a[aria-current=page]{background:var(--grad);color:#fff}
.side-foot{margin-top:auto;display:grid;gap:10px}
.me{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.me b{display:block;font-size:.92rem;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me small{color:var(--mute)}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;padding:12px 24px;background:var(--bg);border-bottom:1px solid var(--line)}
@supports(background:color-mix(in srgb,red,blue)){.top{background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px)}}
.hamb{display:none}
.gs{position:relative;flex:1;max-width:460px}
.gs input{padding-left:38px}
.gs .ic{position:absolute;left:12px;top:12px;color:var(--mute);pointer-events:none}
.pill{font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:99px;background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}.pill.err{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.sp{flex:1}
.view{padding:26px 24px 60px;max-width:1180px;width:100%;margin:0 auto}
.page-h{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.sub{color:var(--mute);margin-top:4px}
.scrim-nav{display:none}
.dd-wrap{position:relative}
.dd{position:absolute;right:0;top:calc(100% + 8px);width:min(380px,92vw);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);z-index:60;max-height:70vh;overflow:auto}
.gs .dd{left:0;right:auto;width:100%}
.dd h4{padding:12px 14px 6px;font-size:.85rem;color:var(--mute);font-weight:600}
.dd .it{display:flex;gap:10px;width:100%;text-align:left;padding:10px 14px;background:none;border:0;border-top:1px solid var(--line);cursor:pointer}
.dd .it:hover{background:var(--card2)}
.dd .it.unread b::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-right:6px}
.dd .it span{display:block}.dd .it small{color:var(--mute)}
.dd .none{padding:16px 14px;color:var(--mute)}

/* content */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card>h2{margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;margin-top:18px}
.cols>div{display:grid;gap:18px;align-content:start}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:18px 0 0;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.strip>div{padding:16px 18px;border-right:1px solid var(--line)}.strip>div:last-child{border-right:0}
.strip b{display:block;font:600 1.6rem var(--fd);line-height:1.1}.strip span{color:var(--mute);font-size:.88rem}
.hero{display:grid;grid-template-columns:1fr auto;gap:22px;align-items:center;padding:26px 28px;border-radius:18px;background:linear-gradient(135deg,#1f3fa8 0%,#5b2fc4 100%);color:#fff;box-shadow:var(--sh)}
.hero h2{font-size:1.5rem;margin:6px 0 8px}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px 16px;opacity:.92;font-size:.95rem}
.hero .cd{font:700 2rem/1.1 var(--fd);text-align:right}
.hero small{opacity:.85;display:block;text-align:right;margin-bottom:12px}
.hero .btn{background:#fff;color:#1b2a7a;border:0}
.hero .btn.ghost{background:rgba(255,255,255,.16);color:#fff}
.hero .lab{font-size:.85rem;opacity:.85;font-weight:600}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick .btn{justify-content:flex-start;height:auto;min-height:46px;white-space:normal;text-align:left}
.filters{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:10px;margin-bottom:16px}
.filters.f3{grid-template-columns:2fr 1fr 1fr}
.item{display:flex;gap:14px;align-items:flex-start;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:10px}
.item.pinned{border-color:color-mix(in srgb,var(--acc) 55%,transparent)}
.item .body{flex:1;min-width:0}
.item h3{margin-bottom:2px;overflow-wrap:anywhere}
.item p.d{color:var(--mute);margin:4px 0 8px;overflow-wrap:anywhere}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.item .row2{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:8px}
.ext{width:48px;height:56px;border-radius:8px;background:var(--card2);display:grid;place-items:center;font:700 .74rem var(--fd);text-transform:uppercase;color:var(--acc);flex:none;border:1px solid var(--line)}
.dblock{width:60px;text-align:center;border-radius:12px;background:var(--card2);padding:9px 0;flex:none;border:1px solid var(--line)}
.dblock b{display:block;font:700 1.4rem/1 var(--fd)}.dblock span{font-size:.78rem;color:var(--mute)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font-size:.78rem;font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mute);background:var(--bg2)}
.badge{font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.badge.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
.badge.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}
.badge.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 17%,transparent)}
.badge.info{color:var(--acc);background:color-mix(in srgb,var(--acc) 16%,transparent)}
.badge.mute{color:var(--mute);background:var(--bg2)}
.info{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;border:1px solid color-mix(in srgb,var(--acc) 35%,transparent);background:color-mix(in srgb,var(--acc) 9%,transparent);color:var(--text);font-size:.92rem;margin-bottom:16px}
.info .ic{color:var(--acc);margin-top:2px}
.info.warn{border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.info.warn .ic{color:var(--warn)}
.empty{text-align:center;padding:40px 20px;border:1px dashed var(--line);border-radius:14px;color:var(--mute);display:grid;gap:8px;justify-items:center}
.empty h3{color:var(--text)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--mute);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--text);border-color:var(--acc)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.tbl{width:100%;border-collapse:collapse;min-width:560px}
.tbl th{text-align:left;font-size:.82rem;color:var(--mute);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl input{min-height:36px;padding:5px 8px;max-width:110px}
.av{width:36px;height:36px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font:700 .82rem var(--fd);overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:92px;height:92px;font-size:1.6rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--inp);gap:2px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--card2);color:var(--text)}
.stu{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line)}
.stu:last-child{border-bottom:0}
.stu label{display:flex;align-items:center;gap:10px;flex:1;cursor:pointer;min-width:0}
.stu small{display:block;color:var(--mute)}
.stu .av{width:30px;height:30px;font-size:.72rem}
.list-box{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--inp)}
.preview{padding:12px 14px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:minmax(120px,200px) 1fr auto;gap:10px 14px;align-items:center}
.kv>div{padding:10px 0;border-bottom:1px solid var(--line)}
pre.code{margin:0;padding:14px;border-radius:12px;background:var(--inp);border:1px solid var(--line);overflow:auto;max-height:280px;font:13px/1.5 ui-monospace,Consolas,'Cascadia Mono',monospace;white-space:pre}
.steps{padding-left:20px;display:grid;gap:8px}
.bar{height:8px;border-radius:5px;background:var(--bg2);overflow:hidden}.bar i{display:block;height:100%;background:var(--grad)}
.photo{display:flex;gap:16px;align-items:center;margin-bottom:16px}

/* auth */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.auth-l{padding:48px;display:flex;flex-direction:column;justify-content:space-between;background:var(--bg2);border-right:1px solid var(--line);gap:36px}
.auth-l h1{font-size:2.3rem;line-height:1.15;max-width:15em}
.auth-l ul{list-style:none;padding:0;margin:0;display:grid;gap:14px}
.auth-l li{display:flex;gap:12px;align-items:flex-start;color:var(--mute)}
.auth-l li b{color:var(--text);display:block}
.auth-l li .ic{color:var(--acc);margin-top:3px}
.auth-r{display:grid;place-items:center;padding:28px;position:relative}
.auth-card{width:min(440px,100%)}
.auth-card h2{font-size:1.4rem;margin-bottom:4px}
.auth-tools{position:absolute;top:16px;right:16px}
.demo-box{margin-top:16px;padding:14px;border-radius:12px;border:1px dashed var(--line);display:grid;gap:10px}

/* modal + toast */
#modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px}
.scrim{position:absolute;inset:0;background:rgba(3,7,25,.66)}
.dlg{position:relative;width:min(580px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);animation:pop .16s ease-out}
.dlg.wide{width:min(860px,100%)}
.dlg>header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg-body{padding:18px;overflow:auto}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:200;display:grid;gap:8px;width:min(440px,calc(100vw - 24px))}
.toast{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);animation:pop .18s ease-out}
.toast.ok .ic{color:var(--ok)}.toast.err{border-color:color-mix(in srgb,var(--bad) 55%,transparent)}.toast.err .ic{color:var(--bad)}
.toast.out{opacity:0;transition:opacity .35s}

@media(max-width:1000px){.filters{grid-template-columns:1fr 1fr}.filters>:first-child{grid-column:1/-1}.cols{grid-template-columns:1fr}.strip{grid-template-columns:1fr 1fr}.strip>div:nth-child(2){border-right:0}.strip>div:nth-child(-n+2){border-bottom:1px solid var(--line)}}
@media(max-width:900px){
  .layout{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:276px;transform:translateX(-102%);transition:transform .2s;z-index:50;height:100%}
  .nav-open .side{transform:none;box-shadow:var(--sh)}
  .nav-open .scrim-nav{display:block;position:fixed;inset:0;background:rgba(3,7,25,.55);z-index:40}
  .hamb{display:inline-grid}.top{padding:10px 14px}.view{padding:18px 14px 50px}
  .auth{grid-template-columns:1fr}.auth-l{padding:28px 22px;border-right:0;border-bottom:1px solid var(--line)}.auth-l h1{font-size:1.6rem}.auth-l ul{display:none}
  .pill{display:none}
}
@media(max-width:620px){
  .g2,.g3,.quick{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.hero .cd,.hero small{text-align:left}
  .item{flex-wrap:wrap}.item .acts{justify-content:flex-start;width:100%}.kv{grid-template-columns:1fr}.kv>div{border:0;padding:2px 0}
  .filters{grid-template-columns:1fr}.strip b{font-size:1.3rem}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div id="modal" hidden></div>

const CLOUD={url:'https://uzdkybjhjeqwkzhqieif.supabase.co',key:'sb_publishable_iM-RPTQIK5dmsLCPtezm-g_b1eIYb_a',mail:'https://script.google.com/macros/s/AKfycbziPR5hm7SBqxzHsYEkbHhZ8ZXnmFn7t1-Rr44QD1QHxVvl6w-pvrz5v8MmFAZN7A5i/exec'};
const jwtRole=k=>{try{return JSON.parse(atob(String(k).split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).role}catch(e){return ''}};
const CLOUD_BAD=!!(CLOUD.key&&(String(CLOUD.key).startsWith('sb_secret_')||jwtRole(CLOUD.key)==='service_role'));
const CLOUD_ON=!!(CLOUD.url&&CLOUD.key)&&!CLOUD_BAD&&/^https:\/\/[^\s/]+\/?$/.test(CLOUD.url);
const MAIL_ON=CLOUD_ON&&/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(String(CLOUD.mail||''));
/* ============ utilities ============ */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl2br=s=>esc(s).replace(/\n/g,'<br>');
const uid=p=>p+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const safeUrl=u=>{try{const x=new URL(String(u||'').trim());return /^https?:$/.test(x.protocol)?x.href:''}catch(e){return ''}};
const IC={
home:'<path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
notes:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/><path d="M9 13h7M9 17h7"/>',
live:'<rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3"/>',

const idb={_:null,open(){return this._||(this._=new Promise((res,rej)=>{if(!window.indexedDB)return rej(new Error('IndexedDB is not available in this browser.'));const r=indexedDB.open('compedu_files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
 async tx(mode,fn){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction('f',mode);const rq=fn(t.objectStore('f'));t.oncomplete=()=>res(rq&&rq.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
 put(k,b){return this.tx('readwrite',s=>s.put(b,k))},get(k){return this.tx('readonly',s=>s.get(k))},del(k){return this.tx('readwrite',s=>s.delete(k)).catch(()=>{})},clear(){return this.tx('readwrite',s=>s.clear()).catch(()=>{})}};

const stBadge=r=>r.st==='pass'?badge('Pass','ok'):r.st==='fail'?badge('Fail','bad'):r.st==='absent'?badge('Absent','warn'):badge('Pending','mute');

   return `<article class="item"><div class="dblock"><b>${Number(c.date.slice(8,10))}</b><span>${new Date(c.date+'T00:00').toLocaleDateString('en-IN',{month:'short'})}</span></div><div class="body"><h3>${esc(c.title)}</h3><div class="chips">${chip(c.subject)}${chip(batchLabel(c.batch))}${st==='live'?badge('Live now','ok'):''}${c.resch?badge('Rescheduled','warn'):''}</div><div class="row2"><span>${icon('clock',16)} ${fmtTime(c.time)} · ${c.dur||60} min</span><span class="mute">${esc(new Date(c.date+'T00:00').toLocaleDateString('en-IN',{weekday:'long'}))}</span></div>${c.resch&&c.prev?`<p class="mute" style="font-size:.88rem;margin-top:6px">Moved from ${fmtDate(c.prev.date)}, ${fmtTime(c.prev.time)}</p>`:''}${c.desc?`<p class="d" style="margin-top:6px">${esc(c.desc)}</p>`:''}${rec?`<p style="margin-top:6px"><a href="${esc(rec)}" target="_blank" rel="noopener noreferrer">${icon('link',15)} Recording or class notes</a></p>`:''}</div>
   <div class="acts">${st!=='past'&&url?`<a class="btn sm pri" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${icon('ext',16)}Join</a>`:''}${st!=='past'?`<button class="btn sm" data-act="class-ics" data-id="${c.id}" title="Download a calendar file">${icon('cal',16)}Add to calendar</button>`:''}${t?`<button class="btn sm" data-act="class-notify" data-id="${c.id}">${icon('wa',16)}Notify</button>${st!=='past'?`<button class="btn sm" data-act="class-resch" data-id="${c.id}">${icon('clock',16)}Reschedule</button>`:''}<button class="btn sm" data-act="class-edit" data-id="${c.id}" aria-label="Edit">${icon('edit',16)}</button><button class="btn sm danger" data-act="class-del" data-id="${c.id}" aria-label="Delete">${icon('trash',16)}</button>`:''}</div></article>`}).join('');

    const a=db.assigns.filter(match).sort((x,y)=>pinCmp(x,y)||x.due.localeCompare(y.due));
    if(!a.length)return empty('room','No assignments',t?'Create an assignment with a due date.':'Nothing assigned right now.',t?`<button class="btn pri" data-act="asg-new">${icon('plus')}New assignment</button>`:'');
    return a.map(x=>{const link=safeUrl(x.url),subs=db.subs.filter(s=>s.aid===x.id).length,tot=students().filter(s=>x.batch==='All'||s.batch===x.batch).length,mine=t?null:mySub(x,u);

  }

/* ============ auth forms ============ */
const MAILRE=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
FORMS.login=fd=>{if(CLOUD_ON)return cloudLogin(fd.get('ident')||'',fd.get('pw')||'');if(!(fd.get('ident')||'').trim())return toast('Enter your email or mobile number.','err');login(ui.auth.role,fd.get('ident'))};
FORMS.signup=fd=>{
  if(CLOUD_ON)return cloudSignup(fd);
  const name=(fd.get('name')||'').trim(),ident=(fd.get('ident')||'').trim(),mail=ident.includes('@'),dg=ident.replace(/\D/g,'');
  if(!name)return toast('Enter your name.','err');
  if(mail?!MAILRE.test(ident):(dg.length<10||dg.length>15))return toast('Enter a valid email address or a 10-digit mobile number.','err');
  if(db.users.some(x=>mail?(x.email||'').toLowerCase()===ident.toLowerCase():(x.mobile||'').replace(/\D/g,'').slice(-10)===dg.slice(-10)))return toast('A profile with that email or mobile number already exists. Log in instead.','err');
  const u={id:uid('u_'),role:'student',name,email:mail?ident:'',mobile:mail?'':ident,dob:'',batch:'',semester:'',year:db.settings.academicYear,roll:(fd.get('roll')||'').trim(),category:'',college:''};
  db.users.push(u);save();LS.set(SKEY,u.id);toast('Profile created. Password was not saved (demo mode).','ok');go('home');route();
};

FORMS.noteSave=async fd=>{
  const id=fd.get('id'),file=fd.get('file'),title=(fd.get('title')||'').trim(),subject=(fd.get('subject')||'').trim();
  if(!title||!subject)return toast('Title and subject are required.','err');
  const meta={title,desc:(fd.get('desc')||'').trim(),subject,batch:fd.get('batch'),sem:fd.get('sem')||''};
  let n=id?db.notes.find(x=>x.id===id):null;
  if(!n){
    if(!file||!file.name)return toast('Choose a file to upload.','err');
    const ext=extOf(file.name);
    if(!EXTS.includes(ext))return toast('.'+ext+' files are not allowed. Use: '+EXTS.map(x=>'.'+x).join(' '),'err');
    if(file.size>MAXF)return toast('That file is '+fmtSize(file.size)+'. The limit here is 20 MB.','err');
    const key='notes/'+uid('f_');
    try{await files.put(key,file)}catch(e){return toast('Could not store the file: '+(e&&e.message||'unknown error'),'err')}
    n=Object.assign({id:uid('n_'),fileName:file.name,size:file.size,ext,mime:file.type,fileKey:key,ts:Date.now()},meta);db.notes.push(n);
  }else Object.assign(n,meta);
  save();closeModal();toast(id?'Note updated.':(CLOUD_ON?'Note uploaded.':'Note uploaded to this browser.'),'ok');render();
  if(!id&&fd.get('notify'))openNotify({title:'New notes: '+n.title,msg:noteMsg(n),batch:n.batch,view:'notes'});
};

FORMS.examSave=fd=>{
  const total=Number(fd.get('total')),pass=Number(fd.get('pass'));
  if(!(total>0))return toast('Total marks must be more than 0.','err');
  if(!(pass>=0&&pass<=total))return toast('Passing marks must be between 0 and the total.','err');
  const meta={title:fd.get('title').trim(),subject:fd.get('subject').trim(),batch:fd.get('batch'),date:fd.get('date'),total,pass};
  const id=fd.get('id');let e=id?db.exams.find(x=>x.id===id):null;
  if(e){Object.assign(e,meta);Object.keys(e.marks).forEach(k=>{if(e.marks[k]!=='AB'&&e.marks[k]>total)delete e.marks[k]})}else{e=Object.assign({id:uid('e_'),published:false,marks:{}},meta);db.exams.push(e);ui.exam.sel=e.id}
  save();closeModal();toast(id?'Exam updated.':'Exam created. Enter or import marks next.','ok');render();
};

ACT['exam-pub']=b=>{const e=db.exams.find(x=>x.id===b.dataset.id);if(!e)return;

function parseCSV(t){const rows=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
  else if(ch==='"')q=true;else if(ch===','){r.push(c);c=''}
  else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';if(r.some(x=>x.trim()!==''))rows.push(r);r=[]}else c+=ch}
  r.push(c);if(r.some(x=>x.trim()!==''))rows.push(r);return rows}
function importParse(e,text){
  const rows=parseCSV(text.replace(/^\uFEFF/,''));if(rows.length<2)return {err:'The file needs a header row and at least one data row.'};
  const H=rows[0].map(h=>h.toLowerCase().replace(/[^a-z0-9]/g,'')),col=n=>H.findIndex(h=>n.includes(h));
  const iR=col(['roll','rollno','rollnumber','rollnum']),iE=col(['email','emailid','emailaddress']),iM=col(['mobile','phone','mobileno','mobilenumber']),iK=col(['marks','score','marksobtained','obtained']);
  if(iK<0)return {err:'No "marks" column found. The header needs marks plus roll, email or mobile.'};
  if(iR<0&&iE<0&&iM<0)return {err:'No roll, email or mobile column found to match students.'};
  const st=examStudents(e),updates={},bad=[],unmatched=[];let blank=0;
  rows.slice(1).forEach((r,i)=>{const line=i+2,g=k=>k<0?'':String(r[k]||'').trim();
    const roll=g(iR),mail=g(iE).toLowerCase(),mob=g(iM).replace(/\D/g,'').slice(-10);
    const s=(roll&&st.find(x=>String(x.roll||'').trim()===roll))||(mail&&st.find(x=>(x.email||'').toLowerCase()===mail))||(mob.length===10&&st.find(x=>(x.mobile||'').replace(/\D/g,'').slice(-10)===mob));
    const id=roll||mail||mob||'(blank)';if(!s)return unmatched.push('Line '+line+': '+id);
    const v=g(iK);if(!v){blank++;return}
    if(/^ab(sent)?$/i.test(v)){updates[s.id]='AB';return}
    const n=Number(v);if(isNaN(n)||n<0||n>e.total)return bad.push('Line '+line+': '+s.name+' has "'+v+'"');updates[s.id]=n});
  return {updates,bad,unmatched,blank};
}

function applyProfile(u,fd){
  const name=(fd.get('name')||'').trim(),email=(fd.get('email')||'').trim(),mobile=(fd.get('mobile')||'').trim(),md=mobile.replace(/\D/g,'');
  if(!name)return 'Enter a name.';
  if(!email&&!mobile)return 'Add an email or a mobile number.';
  if(email&&!MAILRE.test(email))return 'That email address does not look right.';
  if(mobile&&(md.length<10||md.length>15))return 'Mobile number should have 10 to 15 digits.';
  if(email&&db.users.some(x=>x.id!==u.id&&(x.email||'').toLowerCase()===email.toLowerCase()))return 'Another profile already uses that email.';
  if(md&&db.users.some(x=>x.id!==u.id&&(x.mobile||'').replace(/\D/g,'').slice(-10)===md.slice(-10)))return 'Another profile already uses that mobile number.';
  u.name=name;u.email=email;u.mobile=mobile;u.college=(fd.get('college')||'').trim();
  if(u.role==='student'){u.dob=fd.get('dob')||'';u.batch=fd.get('batch')||u.batch;u.semester=fd.get('semester')||'';u.year=(fd.get('year')||'').trim();u.roll=(fd.get('roll')||'').trim();u.category=fd.get('category')||''}
  return null}

/* setup guide */
const SQL=`-- CompEdu: database, access rules and file storage for Supabase.
-- Run this ONCE: Supabase dashboard > SQL Editor > New query > paste > Run.

-- ============ profiles (one row per signed-up person) ============
create table public.profiles (
  id uuid primary key references auth.users(id) on delete cascade,
  role text not null default 'student' check (role in ('student','teacher')),
  name text not null default '',
  email text not null default '',
  mobile text not null default '',
  dob text not null default '',
  batch text not null default '',
  semester text not null default '',
  year text not null default '',
  roll text not null default '',
  category text not null default '',
  college text not null default '',
  photo text not null default '',
  created_at timestamptz not null default now()
);

create or replace function public.is_teacher() returns boolean
language sql security definer stable set search_path = public as
$$ select exists (select 1 from public.profiles where id = auth.uid() and role = 'teacher') $$;

create or replace function public.my_batch() returns text
language sql security definer stable set search_path = public as
$$ select coalesce((select batch from public.profiles where id = auth.uid()), '') $$;

-- creates a student profile automatically when someone signs up
create or replace function public.handle_new_user() returns trigger
language plpgsql security definer set search_path = public as
$$
begin
  insert into public.profiles (id, email, name, mobile, roll)
  values (new.id, coalesce(new.email, ''),
          coalesce(new.raw_user_meta_data->>'name', ''),
          coalesce(new.raw_user_meta_data->>'mobile', ''),
          coalesce(new.raw_user_meta_data->>'roll', ''));
  return new;
end
$$;
revoke execute on function public.handle_new_user() from public, anon, authenticated;
create trigger on_auth_user_created after insert on auth.users
  for each row execute function public.handle_new_user();

alter table public.profiles enable row level security;
create policy profiles_select on public.profiles for select to authenticated
  using (id = auth.uid() or role = 'teacher' or public.is_teacher());
create policy profiles_update_own on public.profiles for update to authenticated
  using (id = auth.uid())
  with check (id = auth.uid() and role = (select p.role from public.profiles p where p.id = auth.uid()));
create policy profiles_update_teacher on public.profiles for update to authenticated
  using (public.is_teacher()) with check (public.is_teacher());

-- ============ settings (batches, defaults) ============
create table public.app_settings (
  id int primary key default 1 check (id = 1),
  batches jsonb not null default '["SE-A","SE-B","TE-A","BE-A"]',
  academic_year text not null default '2026-27',
  country text not null default '91'
);
insert into public.app_settings (id) values (1) on conflict do nothing;
alter table public.app_settings enable row level security;
create policy settings_select on public.app_settings for select to authenticated using (true);
create policy settings_update on public.app_settings for update to authenticated
  using (public.is_teacher()) with check (public.is_teacher());

-- ============ classroom: assignments and submissions ============
create table public.assigns (
  id text primary key, title text not null, descr text not null default '',
  subject text not null default '', batch text not null default 'All',
  due text not null, url text not null default '', pinned boolean not null default false, ts bigint not null
);
alter table public.assigns enable row level security;
create policy assigns_select on public.assigns for select to authenticated
  using (public.is_teacher() or batch = 'All' or batch = public.my_batch());
create policy assigns_teacher on public.assigns for all to authenticated
  using (public.is_teacher()) with check (public.is_teacher());

create table public.subs (
  id text primary key, aid text not null,
  sid uuid not null references public.profiles(id) on delete cascade,
  answer text not null default '', file_name text not null default '', file_key text not null default '',
  size bigint not null default 0, ts bigint not null, late boolean not null default false,
  feedback text not null default ''
);
alter table public.subs enable row level security;
create policy subs_select on public.subs for select to authenticated
  using (public.is_teacher() or sid = auth.uid());
create policy subs_insert on public.subs for insert to authenticated
  with check (sid = auth.uid() and exists (select 1 from public.assigns a where a.id = aid));
create policy subs_update on public.subs for update to authenticated
  using (sid = auth.uid()) with check (sid = auth.uid());
create policy subs_teacher on public.subs for all to authenticated
  using (public.is_teacher()) with check (public.is_teacher());

-- ============ exams and results ============
create table public.exams (
  id text primary key, title text not null, subject text not null default '',
  batch text not null default 'All', edate text not null,
  total numeric not null, pass_marks numeric not null, published boolean not null default false
);
alter table public.exams enable row level security;
create policy exams_select on public.exams for select to authenticated
  using (public.is_teacher() or (published and (batch = 'All' or batch = public.my_batch())));
create policy exams_teacher on public.exams for all to authenticated
  using (public.is_teacher()) with check (public.is_teacher());

create table public.results (
  id text primary key, eid text not null,
  sid uuid not null references public.profiles(id) on delete cascade,
  marks numeric, absent boolean not null default false
);
alter table public.results enable row level security;
create policy results_select on public.results for select to authenticated
  using (public.is_teacher() or (sid = auth.uid()
         and exists (select 1 from public.exams e where e.id = eid and e.published)));
create policy results_teacher on public.results for all to authenticated
  using (public.is_teacher()) with check (public.is_teacher());

-- ============ in-app notifications ============
create table public.notifs (
  id text primary key,
  to_user uuid not null references public.profiles(id) on delete cascade,
  title text not null default '', body text not null default '', view text not null default 'home',
  ts bigint not null, is_read boolean not null default false
);
alter table public.notifs enable row level security;
create policy notifs_select on public.notifs for select to authenticated using (to_user = auth.uid());
create policy notifs_update on public.notifs for update to authenticated
  using (to_user = auth.uid()) with check (to_user = auth.uid());
create policy notifs_insert on public.notifs for insert to authenticated
  with check (public.is_teacher()
              or exists (select 1 from public.profiles p where p.id = to_user and p.role = 'teacher'));

-- ============ table permissions (rows are still limited by the policies above) ============
grant usage on schema public to anon, authenticated;
-- tiny public function used by the keep-alive job and the setup test (reveals no data)
create or replace function public.ping() returns int language sql stable as $$ select 1 $$;
grant execute on function public.ping() to anon, authenticated;
grant select, insert, update, delete on all tables in schema public to authenticated;

-- ============ file storage (private buckets) ============
insert into storage.buckets (id, name, public) values ('notes','notes', false), ('submissions','submissions', false)
  on conflict (id) do nothing;

create policy notes_files_read on storage.objects for select to authenticated
  using (bucket_id = 'notes' and (public.is_teacher()
         or exists (select 1 from public.notes n where n.file_key = 'notes/' || objects.name)));
create policy notes_files_teacher on storage.objects for all to authenticated
  using (bucket_id = 'notes' and public.is_teacher())
  with check (bucket_id = 'notes' and public.is_teacher());

create policy submissions_insert on storage.objects for insert to authenticated
  with check (bucket_id = 'submissions' and (storage.foldername(name))[1] = auth.uid()::text);
create policy submissions_read on storage.objects for select to authenticated
  using (bucket_id = 'submissions'
         and ((storage.foldername(name))[1] = auth.uid()::text or public.is_teacher()));
create policy submissions_delete on storage.objects for delete to authenticated
  using (bucket_id = 'submissions'
         and ((storage.foldername(name))[1] = auth.uid()::text or public.is_teacher()));

on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        run: |
          curl -fsS -X POST "\${{ secrets.SUPABASE_URL }}/rest/v1/rpc/ping" \\
            -H "apikey: \${{ secrets.SUPABASE_ANON_KEY }}" \\
            -H "Content-Type: application/json" -d '{}'`;

 <div class="info" style="margin:0">${icon('info')}<span>${CLOUD_ON?'This site is already connected to Supabase. Use this guide for setup details and the keep-alive job.':'This file is in offline demo mode. Follow these steps to turn it into a real site for your students.'}</span></div>
 <div><h3>1. Create the free Supabase project</h3><ol class="steps"><li>Sign up at supabase.com and create a new project. Save the database password somewhere safe.</li><li>Open <b>SQL Editor</b> then <b>New query</b>, paste the SQL at the bottom of this guide, press <b>Run</b>. It creates the tables, private file storage and the rules that keep each student's data private.</li><li>Open <b>Authentication</b> then <b>Sign In / Providers</b> then <b>Email</b>. For a closed class, turn <b>Confirm email</b> off. Supabase's built-in email sender allows only a few emails per hour, so confirmation emails would block students from signing up. (Trade-off: anyone who finds your link can create an account, but new accounts see only content shared with all batches.)</li></ol></div>
 <div><h3>2. Connect the file to your project</h3><ol class="steps"><li>In Supabase open <b>Project Settings</b> then <b>API</b>. Copy the <b>Project URL</b> and the <b>anon</b> (public) key. Never use the service_role or secret key.</li><li>Paste them into the test box in <b>Account</b>, press <b>Test</b>, and copy the line it shows.</li><li>Open index.html in Notepad, replace the <b>const CLOUD</b> line at the top with the copied line, and save.</li><li>Upload the file to GitHub Pages or Cloudflare Pages as before.</li><li>In Supabase open <b>Authentication</b> then <b>URL Configuration</b>. Set <b>Site URL</b> to your live link, for example https://YOUR-NAME.github.io/compedu/ so password reset links come back to your site.</li></ol></div>
 <div><h3>3. Make yourself the teacher</h3><ol class="steps"><li>Open your live site, choose <b>Student sign up</b> and register with your own email.</li><li>In Supabase SQL Editor run the line at the very end of the SQL below, with your email: <code>update public.profiles set role = 'teacher' where email = 'you@example.com';</code></li><li>Log out and log in again. You now see the teacher tools. Students sign up themselves, and you set each batch in <b>Account</b> then <b>Students</b>.</li></ol></div>
 <div><h3>4. Stop the free project from pausing</h3><p class="mute">Supabase pauses free projects after about a week with no requests. Add this file to your GitHub repository at <code>.github/workflows/keepalive.yml</code> and add two repository secrets, <code>SUPABASE_URL</code> and <code>SUPABASE_ANON_KEY</code> (Settings, Secrets and variables, Actions). GitHub may switch off scheduled jobs after 60 days with no repository activity, so check the Actions tab now and then.</p><pre class="code" tabindex="0">${esc(KEEP)}</pre></div>
 <div><h3>Phone OTP</h3><p class="mute">Not offered. Supabase phone sign-in needs an SMS provider, and SMS normally costs money. Sign-in here uses email and password.</p></div>
 <div><h3>SQL to run once</h3><pre class="code" tabindex="0">${esc(SQL)}</pre><div class="actions" style="margin-top:10px"><button class="btn" data-act="copy-sql">${icon('copy',16)}Copy SQL</button></div></div></div>`,{wide:true});

}

/* ============ send email from the teacher's Gmail (Google Apps Script, free) ============ */
ACT['nf-send']=()=>{
  const s=selected().filter(x=>x.email);
  if(!s.length)return toast('None of the selected students has an email address.','err');
  if(!nf.msg.trim())return toast('Write a message first.','err');
  const ids=s.map(x=>x.id),subject=nf.title,msg=nf.msg,n=s.length;
  ask('Send this email to '+n+' student'+(n>1?'s':'')+' from your Gmail account?','Send email',async()=>{
    toast('Sending…','info');
    try{
      const token=await freshToken();
      const r=await fetch(CLOUD.mail,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token,ids,subject,message:msg}),redirect:'follow'});
      const j=await r.json();
      if(!j.ok)throw new Error(j.error||'Sending failed.');
      const bad=j.failed&&j.failed.length;
      toast('Email sent to '+j.sent+' student'+(j.sent===1?'':'s')+'.'+(bad?' Not sent to: '+j.failed.join(', ')+'.':''),bad?'info':'ok');
    }catch(e){toast(String(e.message||e).includes('Failed to fetch')?'Could not reach the email service. Check the link in the CLOUD setting.':e.message,'err')}
  });
};

/* ============ cloud mode (Supabase over plain REST, no extra libraries) ============ */
const cloud={ready:false,loading:false,sess:null,uid(){return this.sess&&this.sess.user?this.sess.user.id:null}};
const SBS='compedu_sb_session';
const SBURL=CLOUD.url.replace(/\/+$/,'');
function sbLoadSess(){try{cloud.sess=JSON.parse(LS.get(SBS)||'null')}catch(e){cloud.sess=null}}
function sbSaveSess(s){cloud.sess=s;if(s)LS.set(SBS,JSON.stringify(s));else LS.del(SBS)}
const normSess=j=>({access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600),user:j.user||(cloud.sess&&cloud.sess.user)});
const authMsg=j=>{const m=j.error_description||j.msg||j.message||j.error||'Something went wrong.';return /invalid login/i.test(m)?'Wrong email or password, or the email is not confirmed yet.':/rate limit/i.test(m)?'Too many emails were sent recently. Wait a while and try again.':m};
async function authPost(path,body){let r;try{r=await fetch(SBURL+path,{method:'POST',headers:{apikey:CLOUD.key,'Content-Type':'application/json'},body:JSON.stringify(body)})}catch(e){throw new Error('Cannot reach Supabase. Check your internet connection.')}
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(authMsg(j));return j}
async function sbRefresh(){const s=cloud.sess;if(!s||!s.refresh_token)throw new Error('Session expired. Please log in again.');
  let j;try{j=await authPost('/auth/v1/token?grant_type=refresh_token',{refresh_token:s.refresh_token})}catch(e){throw new Error('Session expired. Please log in again.')}
  sbSaveSess(normSess(j))}
async function sbReq(path,o={},retry=true){
  if(retry&&cloud.sess&&cloud.sess.expires_at&&cloud.sess.expires_at*1000-Date.now()<60000){try{await sbRefresh()}catch(e){}}
  const headers=Object.assign({apikey:CLOUD.key},cloud.sess?{Authorization:'Bearer '+cloud.sess.access_token}:{},o.headers||{});
  let r;try{r=await fetch(SBURL+path,Object.assign({},o,{headers}))}catch(e){throw new Error('Cannot reach Supabase. Check your internet connection.')}
  if(r.status===401&&retry&&cloud.sess){await sbRefresh();return sbReq(path,o,false)}
  if(!r.ok){let m='';try{const j=await r.clone().json();m=j.message||j.msg||j.error_description||j.error||''}catch(e){}
    if(/row-level security|permission denied/i.test(m))m='You do not have permission to do that.';throw new Error(m||('Request failed ('+r.status+')'))}
  return r}

/* ---- rows <-> app data ---- */
const T=['profiles','app_settings','notes','classes','posts','assigns','exams','results','subs','notifs'];
function toRows(d){
  const R={};const m=(t,arr,f)=>{R[t]={};arr.forEach(x=>{const r=f(x);R[t][r.id]=r})};
  m('profiles',d.users,u=>({id:u.id,role:u.role,name:u.name||'',email:u.email||'',mobile:u.mobile||'',dob:u.dob||'',batch:u.batch||'',semester:u.semester||'',year:u.year||'',roll:u.roll||'',category:u.category||'',college:u.college||'',photo:u.photo||''}));
  R.app_settings={'1':{id:1,batches:d.settings.batches,academic_year:d.settings.academicYear,country:d.settings.country}};
  m('notes',d.notes,n=>({id:n.id,title:n.title,descr:n.desc||'',subject:n.subject||'',batch:n.batch,sem:n.sem||'',file_name:n.fileName||'',size:n.size||0,ext:n.ext||'',mime:n.mime||'',file_key:n.fileKey||'',ts:n.ts}));
  m('classes',d.classes,c=>({id:c.id,title:c.title,subject:c.subject||'',batch:c.batch,cdate:c.date,ctime:c.time,dur:c.dur||60,link:c.link||'',descr:c.desc||'',recording:c.recording||'',resch:!!c.resch,prev:c.prev||null}));
  m('posts',d.posts,p=>({id:p.id,kind:p.kind,title:p.title,body:p.body||'',subject:p.subject||'',batch:p.batch,url:p.url||'',pinned:!!p.pinned,ts:p.ts}));
  m('assigns',d.assigns,a=>({id:a.id,title:a.title,descr:a.desc||'',subject:a.subject||'',batch:a.batch,due:a.due,url:a.url||'',pinned:!!a.pinned,ts:a.ts}));
  m('exams',d.exams,e=>({id:e.id,title:e.title,subject:e.subject||'',batch:e.batch,edate:e.date,total:e.total,pass_marks:e.pass,published:!!e.published}));
  R.results={};d.exams.forEach(e=>Object.keys(e.marks||{}).forEach(sid=>{const v=e.marks[sid],id=e.id+'__'+sid;R.results[id]={id,eid:e.id,sid,marks:v==='AB'?null:Number(v),absent:v==='AB'}}));
  m('subs',d.subs,s=>({id:s.id,aid:s.aid,sid:s.sid,answer:s.text||'',file_name:s.fileName||'',file_key:s.fileKey||'',size:s.size||0,ts:s.ts,late:!!s.late,feedback:s.feedback||''}));
  R.notifs={};d.notifs.forEach(n=>n.to.forEach(uid=>{const id=n.to.length===1?n.id:n.id+'__'+uid;R.notifs[id]={id,to_user:uid,title:n.title||'',body:n.body||'',view:n.view||'home',ts:n.ts,is_read:n.readBy.includes(uid)}}));
  return R}
function fromRows(o){
  const d=emptyDb(),g=t=>o[t]||[];
  d.users=g('profiles').map(r=>({id:r.id,role:r.role,name:r.name,email:r.email,mobile:r.mobile,dob:r.dob,batch:r.batch,semester:r.semester,year:r.year,roll:r.roll,category:r.category,college:r.college,photo:r.photo||undefined}));
  const s=g('app_settings')[0];if(s)d.settings={batches:Array.isArray(s.batches)&&s.batches.length?s.batches:d.settings.batches,country:s.country||'91',academicYear:s.academic_year||d.settings.academicYear};
  d.notes=g('notes').map(r=>({id:r.id,title:r.title,desc:r.descr,subject:r.subject,batch:r.batch,sem:r.sem,fileName:r.file_name,size:Number(r.size),ext:r.ext,mime:r.mime,fileKey:r.file_key,ts:Number(r.ts)}));
  d.classes=g('classes').map(r=>{const c={id:r.id,title:r.title,subject:r.subject,batch:r.batch,date:r.cdate,time:r.ctime,dur:r.dur,link:r.link,desc:r.descr,recording:r.recording};if(r.resch){c.resch=true;if(r.prev)c.prev=r.prev}return c});
  d.posts=g('posts').map(r=>{const p={id:r.id,kind:r.kind,title:r.title,body:r.body,subject:r.subject,batch:r.batch,pinned:r.pinned,ts:Number(r.ts)};if(r.kind==='resource')p.url=r.url;return p});
  d.assigns=g('assigns').map(r=>({id:r.id,title:r.title,desc:r.descr,subject:r.subject,batch:r.batch,due:r.due,url:r.url,pinned:r.pinned,ts:Number(r.ts)}));
  d.exams=g('exams').map(r=>({id:r.id,title:r.title,subject:r.subject,batch:r.batch,date:r.edate,total:Number(r.total),pass:Number(r.pass_marks),published:r.published,marks:{}}));
  g('results').forEach(r=>{const e=d.exams.find(x=>x.id===r.eid);if(e)e.marks[r.sid]=r.absent?'AB':(r.marks===null?undefined:Number(r.marks));if(e&&e.marks[r.sid]===undefined)delete e.marks[r.sid]});
  d.subs=g('subs').map(r=>({id:r.id,aid:r.aid,sid:r.sid,text:r.answer,fileName:r.file_name,fileKey:r.file_key,size:Number(r.size),ts:Number(r.ts),late:r.late,feedback:r.feedback}));
  d.notifs=g('notifs').map(r=>({id:r.id,to:[r.to_user],title:r.title,body:r.body,view:r.view,ts:Number(r.ts),readBy:r.is_read?[r.to_user]:[]}));
  return d}
function diffRows(a,b){const ops=[];for(const t of T){const A=a[t]||{},B=b[t]||{},ins=[],upd=[],del=[];
  for(const id in B){if(!(id in A))ins.push(B[id]);else if(JSON.stringify(A[id])!==JSON.stringify(B[id]))upd.push(B[id])}
  for(const id in A)if(!(id in B))del.push(id);
  if(ins.length||upd.length||del.length)ops.push({t,ins,upd,del})}return ops}
const JH={'Content-Type':'application/json'};
async function pushOps(ops){
  for(const o of ops){
    if(o.ins.length)await sbReq('/rest/v1/'+o.t,{method:'POST',headers:Object.assign({Prefer:'return=minimal'},JH),body:JSON.stringify(o.ins)});
    for(const r of o.upd){const {id,...rest}=r;const x=await sbReq('/rest/v1/'+o.t+'?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:Object.assign({Prefer:'return=representation'},JH),body:JSON.stringify(rest)});const j=await x.json();if(!Array.isArray(j)||!j.length)throw new Error('You do not have permission to change that.')}}
  for(const o of ops){if(o.del.length){const x=await sbReq('/rest/v1/'+o.t+'?id=in.('+o.del.map(encodeURIComponent).join(',')+')',{method:'DELETE',headers:{Prefer:'return=representation'}});const j=await x.json();if(!Array.isArray(j)||j.length<o.del.length)throw new Error('You do not have permission to delete that.')}}}

/* ---- load, save, refresh ---- */
let snap={},syncTimer=null,inFlight=false,again=false,pending=false;
async function cloudFetch(){const out={};await Promise.all(T.map(async t=>{const r=await sbReq('/rest/v1/'+t+'?select=*&limit=5000');out[t]=await r.json()}));return out}
async function cloudLoad(){const nd=fromRows(await cloudFetch());db=nd;snap=toRows(db)}
function setSync(s){const p=$('#pill');if(!p)return;p.className='pill '+(s==='err'?'err':'ok');p.textContent=s==='saving'?'Saving…':s==='err'?'Save failed':'Cloud · saved'}
function scheduleSync(){if(!cloud.ready)return;pending=true;clearTimeout(syncTimer);setSync('saving');syncTimer=setTimeout(runSync,250)}
async function runSync(){
  if(inFlight){again=true;return}inFlight=true;
  try{do{again=false;const now=toRows(db),ops=diffRows(snap,now);if(ops.length)await pushOps(ops);snap=now}while(again);setSync('ok')}
  catch(e){setSync('err');onSyncError(e)}
  finally{inFlight=false;pending=false}}
async function onSyncError(e){
  if(/expired|log in again/i.test(e.message)){toast(e.message,'err');return cloudLogout()}
  toast('Could not save: '+e.message+' Reloading the latest data.','err');
  try{await cloudLoad();render()}catch(x){toast(x.message,'err')}}
async function cloudRefresh(){
  if(!CLOUD_ON||!cloud.ready||inFlight||pending||document.hidden||!$('#modal').hidden)return;
  const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;
  try{const nd=fromRows(await cloudFetch()),nr=toRows(nd);if(inFlight||pending)return;if(diffRows(snap,nr).length){db=nd;snap=nr;render()}}
  catch(e){if(/expired|log in again/i.test(e.message)){toast(e.message,'err');cloudLogout()}}}
setInterval(cloudRefresh,45000);window.addEventListener('focus',()=>setTimeout(cloudRefresh,300));

async function freshToken(){if(!cloud.sess)throw new Error('Please log in again.');if(cloud.sess.expires_at*1000-Date.now()<60000)await sbRefresh();return cloud.sess.access_token}
/* ---- sign in / out ---- */
async function cloudBoot(){
  cloud.loading=true;cloud.ready=false;render();
  try{if(cloud.sess.expires_at*1000<Date.now()+30000)await sbRefresh();await cloudLoad();
    if(!db.users.some(u=>u.id===cloud.uid()))throw new Error('Your profile was not found. Ask your teacher to check your account.');
    cloud.ready=true}
  catch(e){sbSaveSess(null);db=emptyDb();toast(e.message,'err')}
  cloud.loading=false;route();
  if(cloud.ready&&ui.recovery){ui.recovery=false;openNewPw()}}
async function cloudLogin(email,pw){try{const j=await authPost('/auth/v1/token?grant_type=password',{email:email.trim(),password:pw});sbSaveSess(normSess(j));await cloudBoot()}catch(e){toast(e.message,'err')}}
async function cloudSignup(fd){
  const name=(fd.get('name')||'').trim(),email=(fd.get('email')||'').trim(),pw=fd.get('pw')||'',mobile=(fd.get('mobile')||'').trim(),roll=(fd.get('roll')||'').trim();
  if(!name)return toast('Enter your name.','err');if(!MAILRE.test(email))return toast('Enter a valid email address.','err');if(pw.length<6)return toast('Password needs at least 6 characters.','err');
  if(mobile&&mobile.replace(/\D/g,'').length<10)return toast('Mobile number should have at least 10 digits.','err');
  try{const j=await authPost('/auth/v1/signup',{email,password:pw,data:{name,mobile,roll}});
    if(j.access_token){sbSaveSess(normSess(j));await cloudBoot();toast('Account created.','ok')}
    else{ui.auth.tab='login';renderAuth();toast('Account created. Open the confirmation link we emailed you, then log in.','ok')}}
  catch(e){toast(e.message,'err')}}
async function cloudLogout(){
  try{if(cloud.sess)await fetch(SBURL+'/auth/v1/logout',{method:'POST',headers:{apikey:CLOUD.key,Authorization:'Bearer '+cloud.sess.access_token}})}catch(e){}
  clearTimeout(syncTimer);sbSaveSess(null);cloud.ready=false;cloud.loading=false;db=emptyDb();snap={};ui.auth.tab='login';ui.nav=false;
  history.replaceState(null,'',location.pathname+location.search);renderAuth()}
function openNewPw(){modal('Set a new password',`<form class="stack" data-form="newpw"><label class="f">New password<input name="pw" type="password" minlength="6" required autocomplete="new-password"></label><div class="actions"><button class="btn pri" type="submit">Save password</button></div></form>`)}
FORMS.newpw=async fd=>{try{await sbReq('/auth/v1/user',{method:'PUT',headers:JH,body:JSON.stringify({password:fd.get('pw')})});closeModal();toast('Password updated.','ok')}catch(e){toast(e.message,'err')}};
ACT.forgot=()=>modal('Reset password',`<form class="stack" data-form="forgot"><p class="mute">Enter your account email. We will send a link to choose a new password.</p><label class="f">Email<input name="email" type="email" required autocomplete="username"></label><div class="actions"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn pri" type="submit">Send link</button></div></form>`);
FORMS.forgot=async fd=>{try{await authPost('/auth/v1/recover',{email:(fd.get('email')||'').trim()});closeModal();toast('If that email has an account, a reset link is on its way. Free email sending is limited, so it can take a few minutes.','ok')}catch(e){toast(e.message,'err')}};
async function authFromHash(){
  const h=location.hash.replace(/^#\/?/,'');if(!/(^|&)(access_token|error)=/.test(h))return;
  const p=new URLSearchParams(h);history.replaceState(null,'',location.pathname+location.search+'#/home');
  if(p.get('error')){toast(p.get('error_description')||'That link is not valid.','err');return}
  const s={access_token:p.get('access_token'),refresh_token:p.get('refresh_token'),expires_at:Number(p.get('expires_at'))||Math.floor(Date.now()/1000)+Number(p.get('expires_in')||3600)};
  try{const r=await fetch(SBURL+'/auth/v1/user',{headers:{apikey:CLOUD.key,Authorization:'Bearer '+s.access_token}});if(!r.ok)throw 0;s.user=await r.json();sbSaveSess(s);if(p.get('type')==='recovery')ui.recovery=true}
  catch(e){toast('That link has expired. Request a new one.','err')}}

/* ---- file storage ---- */
const cloudFiles={
  path(k){const [b,...p]=String(k).split('/');if(!b||!p.length)throw new Error('This file has no cloud location.');return b+'/'+p.map(encodeURIComponent).join('/')},
  async put(k,b){await sbReq('/storage/v1/object/'+this.path(k),{method:'POST',headers:{'Content-Type':b.type||'application/octet-stream'},body:b})},
  async get(k){const r=await sbReq('/storage/v1/object/authenticated/'+this.path(k));return r.blob()},
  async del(k){try{await sbReq('/storage/v1/object/'+this.path(k),{method:'DELETE'})}catch(e){}},
  clear(){return Promise.resolve()}};
const files=CLOUD_ON?cloudFiles:idb;

/* ============ boot ============ */
(async function boot(){
  if(CLOUD_BAD)toast('The key in CLOUD is a secret key. Remove it and use the anon (public) key. Running in demo mode.','err');
  if(CLOUD_ON){sbLoadSess();await authFromHash();if(cloud.sess)await cloudBoot();else route()}
  else route();
})();
</script>
